<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Origyn — Login / Register</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f5;
      color: #111;
      min-height: 100vh;
    }

    header {
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6vw;
      background: #f7f7f5;
    }

    .logo {
      font-size: 25px;
      font-weight: 600;
      letter-spacing: -1px;
    }

    .back-link {
      text-decoration: none;
      color: #555;
      font-size: 14px;
    }

    .auth-wrapper {
      min-height: calc(100vh - 82px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
    }

    .auth-container {
      width: 100%;
      max-width: 980px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #fff;
      border: 1px solid #e5e5e2;
      border-radius: 24px;
      overflow: hidden;
    }

    .auth-intro {
      padding: 70px 55px;
      background: #111827;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.6;
      margin-bottom: 20px;
    }

    .auth-intro h1 {
      font-size: clamp(42px, 5vw, 68px);
      line-height: 0.95;
      letter-spacing: -4px;
      margin-bottom: 25px;
    }

    .auth-intro p {
      max-width: 390px;
      color: #c9cdd4;
      line-height: 1.6;
      font-size: 15px;
    }

    .auth-form {
      padding: 55px;
    }

    .auth-form h2 {
      font-size: 30px;
      letter-spacing: -1.5px;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      height: 48px;
      border: 1px solid #d8d8d4;
      border-radius: 8px;
      padding: 0 14px;
      font-size: 14px;
      background: #fff;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #111;
    }

    button {
      width: 100%;
      height: 50px;
      border: none;
      border-radius: 25px;
      background: #111827;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    button:hover {
      opacity: 0.9;
    }

    .divider {
      height: 1px;
      background: #e5e5e2;
      margin: 35px 0;
    }

    .login-title {
      font-size: 23px;
      letter-spacing: -1px;
      margin-bottom: 20px;
    }

    #form-message {
      margin-top: 18px;
      font-size: 13px;
      color: #555;
    }

    @media (max-width: 750px) {
      .auth-container {
        grid-template-columns: 1fr;
      }

      .auth-intro {
        padding: 45px 30px;
      }

      .auth-form {
        padding: 35px 30px;
      }

      .auth-intro h1 {
        font-size: 48px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Origyn</div>
    <a class="back-link" href="index.html">← Back to Origyn</a>
  </header>

  <main class="auth-wrapper">

    <section class="auth-container">

      <div class="auth-intro">
        <div class="eyebrow">Origyn Publisher</div>

        <h1>
          Build.<br>
          Publish.<br>
          Grow.
        </h1>

        <p>
          Create your account and put your products in front of customers.
          Origyn gives creators and innovators a place to publish what they built.
        </p>
      </div>

      <div class="auth-form">

        <h2>Create your account</h2>

        <form id="register-form">

          <div class="form-group">
            <label for="register-name">Name</label>
            <input
              id="register-name"
              name="name"
              type="text"
              placeholder="Your name"
              required
            >
          </div>

          <div class="form-group">
            <label for="register-email">Email</label>
            <input
              id="register-email"
              name="email"
              type="email"
              placeholder="you@example.com"
              required
            >
          </div>

          <div class="form-group">
            <label for="register-password">Password</label>
            <input
              id="register-password"
              name="password"
              type="password"
              placeholder="Create a password"
              required
            >
          </div>

          <div class="form-group">
            <label for="register-role">Account type</label>

            <select id="register-role" name="role">
              <option value="customer">Customer</option>
              <option value="publisher">Publisher</option>
            </select>
          </div>

          <button type="submit">
            Create account →
          </button>

        </form>

        <div class="divider"></div>

        <h3 class="login-title">Already have an account?</h3>

        <form id="login-form">

          <div class="form-group">
            <label for="login-email">Email</label>
            <input
              id="login-email"
              name="email"
              type="email"
              placeholder="you@example.com"
              required
            >
          </div>

          <div class="form-group">
            <label for="login-password">Password</label>
            <input
              id="login-password"
              name="password"
              type="password"
              placeholder="Your password"
              required
            >
          </div>

          <button type="submit">
            Log in →
          </button>

        </form>

        <div id="form-message"></div>

      </div>

    </section>

  </main>

  <script src="auth.js"></script>

</body>
</html>
